<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KraiPRO Stor - Inventory System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-amber-500">KraiPRO Stor</h1>
        <p class="text-xs text-slate-400">Real-Time Inventory Management System</p>
      </div>
      <div id="statusBadge" class="px-3 py-1 text-xs rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
        Connecting...
      </div>
    </header>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Add Item Form -->
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit space-y-4 shadow-lg">
        <h2 class="text-lg font-semibold text-slate-200">Add Stock Item</h2>
        <form id="itemForm" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Item Name</label>
            <input type="text" id="itemName" required placeholder="e.g. Engine Oil 4L" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Category</label>
            <input type="text" id="itemCategory" required placeholder="e.g. Lubricants" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Quantity</label>
              <input type="number" id="itemQty" min="0" required placeholder="10" 
                     class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Price (RM)</label>
              <input type="number" step="0.01" id="itemPrice" min="0" required placeholder="120.00" 
                     class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
            </div>
          </div>
          <button type="submit" 
                  class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-lg text-sm transition duration-150">
            + Add Stock Item
          </button>
        </form>
      </div>

      <!-- Inventory Table -->
      <div class="lg:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4 shadow-lg">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-semibold text-slate-200">Current Inventory</h2>
          <span id="totalValue" class="text-xs font-bold text-amber-400 bg-slate-900 px-3 py-1.5 rounded-md border border-slate-700">Total Value: RM 0.00</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="text-xs text-slate-400 uppercase bg-slate-900/50 border-b border-slate-700">
              <tr>
                <th class="py-3 px-3">Item</th>
                <th class="py-3 px-3">Category</th>
                <th class="py-3 px-3 text-center">Qty</th>
                <th class="py-3 px-3 text-right">Price</th>
                <th class="py-3 px-3 text-center">Action</th>
              </tr>
            </thead>
            <tbody id="inventoryTable" class="divide-y divide-slate-700/50">
              <tr>
                <td colspan="5" class="py-6 text-center text-slate-500">Loading inventory data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBtl82M_CFT_fTzuUKHhnC9zablqT1BteY",
      authDomain: "kraipro-stor.firebaseapp.com",
      projectId: "kraipro-stor",
      storageBucket: "kraipro-stor.firebasestorage.app",
      messagingSenderId: "760657174639",
      appId: "1:760657174639:web:a4aa7876b5e05526daed9a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const inventoryCol = collection(db, "inventory");

    const statusBadge = document.getElementById("statusBadge");
    const itemForm = document.getElementById("itemForm");
    const inventoryTable = document.getElementById("inventoryTable");
    const totalValueEl = document.getElementById("totalValue");

    // Real-Time Database Listener
    onSnapshot(inventoryCol, (snapshot) => {
      statusBadge.textContent = "Live Connected";
      statusBadge.className = "px-3 py-1 text-xs rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";

      if (snapshot.empty) {
        inventoryTable.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-500">No items found in stock. Add one on the left!</td></tr>`;
        totalValueEl.textContent = "Total Value: RM 0.00";
        return;
      }

      let html = "";
      let grandTotal = 0;

      snapshot.docs.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;
        const totalItemVal = (item.quantity || 0) * (item.price || 0);
        grandTotal += totalItemVal;

        html += `
          <tr class="hover:bg-slate-700/30 transition">
            <td class="py-3 px-3 font-medium text-slate-100">${item.name}</td>
            <td class="py-3 px-3 text-slate-400"><span class="bg-slate-900 text-xs px-2 py-0.5 rounded border border-slate-700">${item.category}</span></td>
            <td class="py-3 px-3 text-center font-semibold text-amber-400">${item.quantity}</td>
            <td class="py-3 px-3 text-right">RM ${Number(item.price).toFixed(2)}</td>
            <td class="py-3 px-3 text-center">
              <button onclick="deleteItem('${id}')" class="text-rose-400 hover:text-rose-300 text-xs font-medium hover:underline">Delete</button>
            </td>
          </tr>
        `;
      });

      inventoryTable.innerHTML = html;
      totalValueEl.textContent = `Total Value: RM ${grandTotal.toFixed(2)}`;
    }, (error) => {
      console.error(error);
      statusBadge.textContent = "Error Connecting";
      statusBadge.className = "px-3 py-1 text-xs rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20";
    });

    // Add New Inventory Item
    itemForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("itemName").value.trim();
      const category = document.getElementById("itemCategory").value.trim();
      const quantity = parseInt(document.getElementById("itemQty").value, 10);
      const price = parseFloat(document.getElementById("itemPrice").value);

      if (!name || !category || isNaN(quantity) || isNaN(price)) return;

      try {
        await addDoc(inventoryCol, {
          name,
          category,
          quantity,
          price,
          createdAt: serverTimestamp()
        });
        itemForm.reset();
      } catch (err) {
        alert("Failed to save item: " + err.message);
      }
    });

    // Delete Inventory Item
    window.deleteItem = async (id) => {
      if (confirm("Delete this inventory item?")) {
        try {
          await deleteDoc(doc(db, "inventory", id));
        } catch (err) {
          alert("Failed to delete item: " + err.message);
        }
      }
    };
  </script>
</body>
</html>
